name: CodeQL

# Eligibility gate (Official Rules 7d): CodeQL enabled with no unaddressed
# critical or high findings.
#
# Code scanning (the Security tab) needs a public repo, or GitHub's paid
# Code Security add-on for private ones. While this repo is private the
# upload is skipped, results are kept as an artifact, and
# scripts/codeql_gate.py fails the build on any high/critical finding.
# Once the repo is public (required for submission) results upload too.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Gate on high/critical findings
        run: python3 scripts/codeql_gate.py sarif-results | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore
