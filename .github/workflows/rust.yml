name: Rust (agents)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: agents/Cargo.toml

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agents
      - name: rustfmt
        run: cargo fmt --manifest-path $MANIFEST --check
      - name: clippy (default features)
        run: cargo clippy --manifest-path $MANIFEST --all-targets -- -D warnings
      - name: clippy (llm feature)
        run: cargo clippy --manifest-path $MANIFEST --all-targets --features llm -- -D warnings

  test:
    name: tests (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        features: [default, llm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agents
          key: ${{ matrix.features }}
      - name: cargo test
        run: |
          if [ "${{ matrix.features }}" = "llm" ]; then FEATURES="--features llm"; fi
          cargo test --manifest-path $MANIFEST $FEATURES

  offline-evals:
    name: panel evals (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agents
      # Deterministic models, so every case must pass: guards routing,
      # required sections, state baselines and expected citations.
      - name: housing-eval
        run: >
          cargo run --manifest-path $MANIFEST --bin housing-eval --
          --min-pass-rate 1.0 --out eval-report.json --markdown eval-summary.md
      - name: Job summary
        if: always()
        run: test -f eval-summary.md && cat eval-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-eval-report
          path: |
            eval-report.json
            eval-summary.md
          if-no-files-found: ignore

  sbom:
    name: SBOM matches Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agents
          cache-bin: true
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Compare committed SBOM with a fresh one
        working-directory: agents
        run: |
          cargo cyclonedx -f json --all-features --target all --spec-version 1.5 --override-filename fresh-sbom
          python3 ../scripts/sbom_diff.py sbom.cdx.json fresh-sbom.json

  state-data:
    name: state baseline data is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Re-fetch the Census files and confirm the committed derived table
      # matches what the script produces (Official Rules: automated data
      # acquisition, reproducible results).
      - name: Rebuild county and state baselines (fails if county sums don't match state totals)
        run: python3 scripts/fetch_state_baseline.py
      - name: Rebuild completion factors
        run: python3 scripts/fetch_construction_timing.py
      - name: Committed tables match
        run: git diff --exit-code -- data/derived/
