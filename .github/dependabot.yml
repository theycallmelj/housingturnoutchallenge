# Eligibility gate (Official Rules 7d): Dependabot enabled.
# Any dependency PR must keep the SBOM current (AGENTS.md section 1).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /agents
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /prototypes/state-housing-policy-lab
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # Vite 8 depends on lightningcss (MPL-2.0), which AGENTS.md section 1
      # does not allow. Security fixes for Vite 7 still arrive as patches.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
